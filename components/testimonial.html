<section class="py-32 bg-light-text"
    x-data="window.location.pathname.includes('services.html') ? servicesTestimonialSlider() : testimonialSlider()"
    x-init="console.log('Testimonial component initialized')">
    <div class="container mx-auto px-6">
        <!-- Header Section -->
        <div class="text-center mb-32">
            <h2 class="text-serif text-5xl text-dark-text mb-6">What Our Clients Say</h2>
            <p class="text-lg text-dark-grey max-w-2xl mx-auto">
                Don't just take our word for it. Hear from businesses we've helped transform and grow.
            </p>
        </div>

        <div class="max-w-4xl mx-auto text-center">
            <div class="testimonial-content transition-opacity duration-300 mb-12 flex items-start gap-6"
                :class="isTransitioning ? 'opacity-0' : 'opacity-100'">
                <i class="fas fa-quote-left text-9xl text-copper opacity-30 -mt-16 -mr-20"></i>
                <p class="text-lg md:text-xl lg:text-2xl text-dark-text leading-relaxed italic font-medium text-left"
                    x-text="currentTestimonial.quote">
                    ""
                </p>
            </div>

            <div class="flex flex-col items-center">
                <div class="testimonial-image transition-opacity duration-300 w-24 h-24 rounded-full overflow-hidden mb-4 border-2 border-copper shadow-md"
                    :class="isTransitioning ? 'opacity-0' : 'opacity-100'">
                    <img :src="currentTestimonial.image" :alt="currentTestimonial.name"
                        class="w-full h-full object-cover">
                </div>

                <div class="mb-8">
                    <h5 class="text-copper font-bold text-lg italic mb-1" x-text="currentTestimonial.name">Gahrrett
                        Thomas</h5>
                    <p class="text-dark-text text-sm tracking-wide uppercase" x-text="currentTestimonial.title">Graphic
                        and Web Designer</p>
                </div>

                <div class="flex justify-center items-center space-x-6">
                    <button @click="previousTestimonial()"
                        class="w-8 h-8 rounded-full text-copper flex items-center justify-center hover:bg-opacity-80 transition-all duration-200">
                        <i class="fas fa-chevron-left text-2xl"></i>
                    </button>

                    <div class="flex space-x-3">
                        <template x-for="(testimonial, index) in testimonials" :key="index">
                            <span class="dot" :class="index === currentIndex ? 'active' : ''"
                                @click="currentIndex = index"></span>
                        </template>
                    </div>

                    <button @click="nextTestimonial()"
                        class="w-8 h-8 rounded-full text-copper flex items-center justify-center hover:bg-opacity-80 transition-all duration-200">
                        <i class="fas fa-chevron-right text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Navigation Dot Styles */
        .dot {
            height: 12px;
            width: 12px;
            background-color: #ede3cc;
            /* Slate 400 */
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.3s ease;
            cursor: pointer;
            margin: 0 6px;
        }

        .dot.active {
            background-color: var(--copper);
            /* Blue 600 */
        }
    </style>
</section>
