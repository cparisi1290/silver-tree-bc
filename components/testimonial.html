<section class="py-32 bg-light-text" x-data="testimonialSlider()">
    <div class="container mx-auto px-6 pl-36">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
            <div class="relative">
                <i class="fas fa-quote-left text-9xl text-copper opacity-20 absolute -top-16 -left-4"></i>
                <div class="testimonial-content transition-opacity duration-300"
                    :class="isTransitioning ? 'opacity-0' : 'opacity-100'">
                    <blockquote class="text-2xl text-dark-text italic font-medium relative z-10 pl-8"
                        x-text="currentTestimonial.quote">
                        "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut
                        labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco
                        laboris."
                    </blockquote>
                    <div class="mt-6">
                        <div>
                            <div class="text-xl text-dark-text pl-8" x-text="currentTestimonial.name">
                                BlossomMenezes
                            </div>
                            <div class="text-dark-text text-lg pl-8" x-text="currentTestimonial.title">Marketing
                                Director
                            </div>
                        </div>
                        <div class="flex gap-4 mt-8 pl-8">
                            <button @click="previousTestimonial()"
                                class="w-10 h-10 rounded-full bg-copper text-white flex items-center justify-center hover:bg-opacity-80 transition-colors">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <button @click="nextTestimonial()"
                                class="w-10 h-10 rounded-full bg-copper text-white flex items-center justify-center hover:bg-opacity-80 transition-colors">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="order-1 md:order-2">
                <div class="testimonial-image transition-opacity duration-300"
                    :class="isTransitioning ? 'opacity-0' : 'opacity-100'">
                    <img :src="currentTestimonial.image" :alt="currentTestimonial.name"
                        class="w-full rounded-xl shadow-xl">
                </div>
            </div>
        </div>
    </div>
</section>
